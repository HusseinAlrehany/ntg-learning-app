<div class="topics-page">
  <!-- Page Header -->
  <header class="page-header">
    <div class="header-content">
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Manage your learning content</p>
    </div>
    <div class="header-stat">
      <span class="stat-label">Total Categories</span>
      <span class="stat-value">{{ categories.length }}</span>
    </div>
  </header>

  <!-- Categories Grid -->
  <div class="categories-grid">
    <div *ngFor="let category of categories" class="category-card">
      <!-- Category Header - Clickable -->
      <div class="category-header" (click)="toggleCategory(category)">
        <div class="category-left">
          <button class="toggle-icon" [class.expanded]="category.expanded">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </button>
          <div class="category-info">
            <h2 class="category-name">{{ category.categoryName }}</h2>
            <p class="category-meta">{{ category.topicWithProgressList.length }} topics</p>
          </div>
        </div>

        <div class="category-badge">
          {{ category.topicWithProgressList.length }}
        </div>
      </div>

      <!-- Topics Section -->
      <div class="topics-section" [class.expanded]="category.expanded">
        <!-- Topics List -->
        <div class="topics-container" *ngIf="category.topicWithProgressList.length > 0">
          <div *ngFor="let topic of category.topicWithProgressList" class="topic-item">
            <div class="topic-info">
              <div class="topic-icon">📖</div>
              <div class="topic-details">
                <h3 class="topic-name">{{ topic.name }}</h3>
                <p class="topic-description">{{ topic.description }}</p>
              </div>
            </div>

            <div class="topic-actions">
              <button class="action-btn edit-btn" (click)="openEditTopicPopup(category, topic)" title="Edit topic">
                <span>✏️</span> Edit
              </button>
              <button class="action-btn delete-btn" (click)="deleteTopicById(topic.topicId)" title="Delete topic">
                <span>🗑️</span> Delete
              </button>
            </div>
          </div>
        </div>

        <!-- Empty State -->
        <div class="empty-state" *ngIf="category.topicWithProgressList.length === 0">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <line x1="9" y1="15" x2="15" y2="15"></line>
          </svg>
          <p>No topics added yet</p>
        </div>

        <!-- Category Actions -->
        <div class="category-footer">
          <button class="action-btn secondary-btn" (click)="openEditCategoryPopup(category)" title="Edit category">
            <span>✏️</span> Edit Category
          </button>
          <button class="action-btn danger-btn" (click)="deleteCategoryById(category.categoryId)" title="Delete category">
            <span>🗑️</span> Delete Category
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Manage Popup -->
  <app-manage-topics-category-popup
    (close)="closePopup()"
    [isOpen]="isPopupOpen()"
    [category]="selectedCategory()"
    [topic]="selectedTopic()"
    [isEditMode]="isEditMode()"
    [errorMessage]="errorMessage"
  >
  </app-manage-topics-category-popup>
</div>
