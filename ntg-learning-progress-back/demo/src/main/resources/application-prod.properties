# Database Configuration (Production)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Database Driver (Production) - PostgreSQL for free hosting
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration (Production)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Admin Configuration (Production)
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.name=${ADMIN_NAME:Administrator}

# CORS Configuration (Production)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=Origin,Access-Control-Allow-Origin,Content-Type,Accept,Authorization,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
cors.exposed.headers=Origin,Content-Type,Accept,Authorization,Access-Control-Allow-Origin,Access-Control-Allow-Credentials
cors.allow.credentials=true
cors.max.age=3600

# Cookie Security (Production - secure for production)
app.cookie.secure=true

# Production specific settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=WARN

# Server port (will be overridden by platform)
server.port=${PORT:8080}