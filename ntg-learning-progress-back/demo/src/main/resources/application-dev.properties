# Database Configuration (Development)
# this env variables(jwt config, admin config, database username and password) are configured in the edit window
# from 3 dots besides the run icon on top besides the debug

spring.datasource.url=jdbc:mysql://localhost:3306/ntg_learning_app
spring.datasource.username=${DB_USERNAME:springstudent}
spring.datasource.password=${DB_PASSWORD:springstudent}

# JWT Configuration (Development)
# Use environment variable if set, otherwise use a development fallback
jwt.secret=${JWT_SECRET:ODQzNTY3ODkzNjk2OTc2NDUzMjc1OTc0NDMyNjk3UjYzNDk3NlI3Mzg0NjdUUjY3OFQzNDg2NVI2ODM0Ujg3NjNUNDc4Mzc4NjM3NjY0NTM4NzQ1NjczODY1NzgzNjc4NTQ4NzM1Njg3UjM=}
jwt.expiration=86400000

# Admin Configuration (Development)
admin.email=${ADMIN_EMAIL:admin@ntg.com}
admin.password=${ADMIN_PASSWORD:test123}
admin.name=${ADMIN_NAME:Administrator}

# CORS Configuration (Development)
cors.allowed.origins=http://localhost:4200,http://localhost:4201
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=Origin,Access-Control-Allow-Origin,Content-Type,Accept,Authorization,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
cors.exposed.headers=Origin,Content-Type,Accept,Authorization,Access-Control-Allow-Origin,Access-Control-Allow-Credentials
cors.allow.credentials=true
cors.max.age=3600

# Cookie Security (Development - not secure for development)
app.cookie.secure=false

# Development specific settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG